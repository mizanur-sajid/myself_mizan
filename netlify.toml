[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Global security & base headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Next.js immutable static build assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PDF.js CMaps
[[headers]]
  for = "/cmaps/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static PDF documents (resume, thesis)
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/uploads/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=86400"

# Static upload images & certificates
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# SPA Fallbacks
[[redirects]]
  from = "/secure-panel/*"
  to = "/secure-panel/index.html"
  status = 200

[[redirects]]
  from = "/secure-login/*"
  to = "/secure-login/index.html"
  status = 200
